<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller 3D — Control de producción</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --border: #262626;
      --border-hover: #404040;
      --text: #ffffff;
      --text-muted: #888888;
      --input-bg: #000000;
      --accent: #ffffff;
      --accent-black: #000000;
      --danger: #ff4d4d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1000px; margin: 0 auto; }

    header { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { background: var(--accent); color: var(--accent-black); font-weight: 800; padding: 6px 10px; border-radius: 6px; font-size: 1.1rem; }
    h1 { font-size: 1.3rem; font-weight: 600; tracking: -0.02em; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

    nav { display: flex; gap: 8px; margin-bottom: 24px; }
    nav button { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem; cursor: pointer; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
    nav button:hover { border-color: var(--border-hover); color: var(--text); }
    nav button.active { background: var(--accent); color: var(--accent-black); border-color: var(--accent); font-weight: 600; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .card h2 { font-size: 1.05rem; margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input, select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border 0.2s; }
    input:focus, select:focus { border-color: var(--text); }

    .btn-primary { background: var(--accent); color: var(--accent-black); border: none; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; height: 40px; }
    .btn-primary:hover { opacity: 0.9; }

    /* Estilos para Tarjetas con Gráficos Circulares */
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .item-card { background: var(--input-bg); border: 1px solid var(--border); padding: 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
    .item-card:hover { border-color: var(--border-hover); }

    .item-details { flex-grow: 1; }
    .item-details h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: inline-block; }
    .item-details p { font-size: 0.8rem; color: var(--text-muted); }

    /* Indicador Circular SVG */
    .circle-container { position: relative; width: 64px; height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .circle-container svg { transform: rotate(-90deg); width: 64px; height: 64px; }
    .circle-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .circle-progress { fill: none; stroke: var(--text); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
    .circle-text { position: absolute; font-size: 0.75rem; font-weight: 700; color: var(--text); }

    .btn-delete { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; padding: 4px; opacity: 0.6; transition: opacity 0.2s; }
    .btn-delete:hover { opacity: 1; }

    /* Calculadora & Resultados */
    .calc-results { background: var(--input-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; text-align: center; }
    .result-box h4 { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .result-box p { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .result-box.total p { color: var(--text); font-size: 1.3rem; text-decoration: underline; }

    .orders-list { display: grid; gap: 12px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-pending { border: 1px solid var(--text-muted); color: var(--text-muted); }
    .badge-completed { background: var(--text); color: var(--accent-black); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">3D</div>
      <div>
        <h1>Taller 3D — Control de producción</h1>
        <p class="subtitle">Filamento, costes y pedidos en un solo sitio</p>
      </div>
    </div>
  </header>

  <nav>
    <button class="active" onclick="switchTab('filamentos', event)">Filamentos</button>
    <button onclick="switchTab('calculadora', event)">Calculadora</button>
    <button onclick="switchTab('pedidos', event)">Pedidos</button>
  </nav>

  <!-- TAB FILAMENTOS -->
  <div id="tab-filamentos" class="tab-content active">
    <div class="card">
      <h2>Añadir filamento</h2>
      <form id="filamentForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Material</label>
            <input type="text" id="material" placeholder="PLA, PETG, ABS..." required>
          </div>
          <div class="form-group">
            <label>Color</label>
            <input type="text" id="colorName" placeholder="Blanco mate" required>
          </div>
          <div class="form-group">
            <label>Muestra de color</label>
            <input type="color" id="colorHex" value="#ffffff" style="height: 40px; padding: 2px; cursor: pointer;">
          </div>
          <div class="form-group">
            <label>Stock actual (g)</label>
            <input type="number" id="stock" placeholder="1000" min="0" required>
          </div>
          <div class="form-group">
            <label>Precio de compra (€/kg)</label>
            <input type="number" id="price" step="0.01" placeholder="19.90" min="0" required>
          </div>
          <div class="form-group" style="justify-content: flex-end;">
            <button type="submit" class="btn-primary">Añadir a inventario</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Inventario de Filamentos</h2>
      <div id="inventoryContainer" class="inventory-grid"></div>
    </div>
  </div>

  <!-- TAB CALCULADORA -->
  <div id="tab-calculadora" class="tab-content">
    <div class="card">
      <h2>Calculadora de costes por pieza</h2>
      <form id="calcForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Seleccionar Filamento</label>
            <select id="calcFilamentSelect" required></select>
          </div>
          <div class="form-group">
            <label>Peso de la pieza (g)</label>
            <input type="number" id="calcWeight" placeholder="120" min="1" required>
          </div>
          <div class="form-group">
            <label>Tiempo de impresión (Horas)</label>
            <input type="number" id="calcHours" step="0.1" placeholder="4.5" required>
          </div>
          <div class="form-group">
            <label>Consumo Impresora (W)</label>
            <input type="number" id="calcPower" value="150" required>
          </div>
          <div class="form-group">
            <label>Precio Luz (€/kWh)</label>
            <input type="number" id="calcElectricityPrice" step="0.01" value="0.25" required>
          </div>
          <div class="form-group">
            <label>Margen de Beneficio (%)</label>
            <input type="number" id="calcMargin" value="30" required>
          </div>
        </div>
      </form>

      <div class="calc-results">
        <div class="result-box">
          <h4>Coste Filamento</h4>
          <p id="resFilament">0.00 €</p>
        </div>
        <div class="result-box">
          <h4>Coste Luz</h4>
          <p id="resPower">0.00 €</p>
        </div>
        <div class="result-box">
          <h4>Base Producción</h4>
          <p id="resBase">0.00 €</p>
        </div>
        <div class="result-box total">
          <h4>Precio Sugerido</h4>
          <p id="resTotal">0.00 €</p>
        </div>
      </div>
      
      <div style="margin-top: 16px; text-align: right;">
        <button type="button" class="btn-primary" onclick="createOrderFromCalc()">Guardar Pedido y Descontar Stock</button>
      </div>
    </div>
  </div>

  <!-- TAB PEDIDOS -->
  <div id="tab-pedidos" class="tab-content">
    <div class="card">
      <h2>Control de Pedidos</h2>
      <div id="ordersContainer" class="orders-list"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAEFQO0ulPrzrbmDOsvhHYKphnGnMJTDi8",
      authDomain: "taller-3d-000.firebaseapp.com",
      projectId: "taller-3d-000",
      storageBucket: "taller-3d-000.firebasestorage.app",
      messagingSenderId: "19958615596",
      appId: "1:19958615596:web:f2217206ae338f3eda4b89",
      measurementId: "G-3C4NFGG8TP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const filamentsRef = collection(db, "filamentos");
    const ordersRef = collection(db, "pedidos");

    let loadedFilaments = [];

    window.switchTab = (tabName, evt) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      evt.target.classList.add('active');
    };

    // --- FILAMENTOS ---
    document.getElementById('filamentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await addDoc(filamentsRef, {
        material: document.getElementById('material').value,
        colorName: document.getElementById('colorName').value,
        colorHex: document.getElementById('colorHex').value,
        stock: Number(document.getElementById('stock').value),
        price: Number(document.getElementById('price').value),
        createdAt: new Date()
      });
      document.getElementById('filamentForm').reset();
    });

    onSnapshot(filamentsRef, (snapshot) => {
      const container = document.getElementById('inventoryContainer');
      const select = document.getElementById('calcFilamentSelect');
      
      container.innerHTML = '';
      select.innerHTML = '<option value="">Seleccionar filamento...</option>';
      loadedFilaments = [];

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        loadedFilaments.push({ id, ...item });

        // Cálculo de porcentaje para el círculo (Asumiendo bobina estándar de 1000g)
        const maxCapacity = 1000;
        const percentage = Math.min(100, Math.max(0, Math.round((item.stock / maxCapacity) * 100)));
        const strokeDashoffset = 163 - (163 * percentage) / 100; // 163 es el perímetro del círculo r=26

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-details">
            <h3><span class="color-dot" style="background:${item.colorHex}"></span> ${item.material}</h3>
            <p>${item.colorName}</p>
            <p style="margin-top:4px;"><strong>${item.price.toFixed(2)} €/kg</strong></p>
          </div>

          <div class="circle-container">
            <svg>
              <circle class="circle-bg" cx="32" cy="32" r="26"></circle>
              <circle class="circle-progress" cx="32" cy="32" r="26" style="stroke-dasharray: 163; stroke-dashoffset: ${strokeDashoffset};"></circle>
            </svg>
            <div class="circle-text">${item.stock}g</div>
          </div>

          <button class="btn-delete" onclick="deleteItem('${id}')" title="Eliminar">✕</button>
        `;
        container.appendChild(card);

        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${item.material} - ${item.colorName} (${item.stock}g restantes)`;
        select.appendChild(opt);
      });
    });

    window.deleteItem = async (id) => {
      if (confirm('¿Eliminar este filamento del inventario?')) await deleteDoc(doc(db, "filamentos", id));
    };

    // --- CALCULADORA ---
    const calcInputs = ['calcFilamentSelect', 'calcWeight', 'calcHours', 'calcPower', 'calcElectricityPrice', 'calcMargin'];
    calcInputs.forEach(id => document.getElementById(id).addEventListener('input', calculateCost));

    let currentCalculatedPrice = 0;

    function calculateCost() {
      const filId = document.getElementById('calcFilamentSelect').value;
      const weight = Number(document.getElementById('calcWeight').value) || 0;
      const hours = Number(document.getElementById('calcHours').value) || 0;
      const watts = Number(document.getElementById('calcPower').value) || 0;
      const kwhPrice = Number(document.getElementById('calcElectricityPrice').value) || 0;
      const margin = Number(document.getElementById('calcMargin').value) || 0;

      const filament = loadedFilaments.find(f => f.id === filId);
      const filPricePerGram = filament ? (filament.price / 1000) : 0;

      const costFilament = weight * filPricePerGram;
      const costPower = (watts / 1000) * hours * kwhPrice;
      const costBase = costFilament + costPower;
      const priceTotal = costBase * (1 + (margin / 100));

      currentCalculatedPrice = priceTotal;

      document.getElementById('resFilament').textContent = `${costFilament.toFixed(2)} €`;
      document.getElementById('resPower').textContent = `${costPower.toFixed(2)} €`;
      document.getElementById('resBase').textContent = `${costBase.toFixed(2)} €`;
      document.getElementById('resTotal').textContent = `${priceTotal.toFixed(2)} €`;
    }

    window.createOrderFromCalc = async () => {
      const filId = document.getElementById('calcFilamentSelect').value;
      const weight = Number(document.getElementById('calcWeight').value);
      
      if (!filId || !weight) {
        alert("Selecciona un filamento y peso válido.");
        return;
      }

      const clientName = prompt("Nombre del cliente o proyecto:");
      if (!clientName) return;

      const filament = loadedFilaments.find(f => f.id === filId);

      await addDoc(ordersRef, {
        client: clientName,
        filament: `${filament.material} (${filament.colorName})`,
        weight: weight,
        price: currentCalculatedPrice,
        status: "Pendiente",
        createdAt: new Date()
      });

      const newStock = Math.max(0, filament.stock - weight);
      await updateDoc(doc(db, "filamentos", filId), { stock: newStock });

      alert("Pedido registrado y stock descontado.");
    };

    // --- PEDIDOS ---
    onSnapshot(ordersRef, (snapshot) => {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '';

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div>
            <h3 style="font-size:1.05rem;">${item.client}</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:2px;">${item.filament} | ${item.weight}g | Total: <strong>${item.price.toFixed(2)} €</strong></p>
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <span class="badge ${item.status === 'Completado' ? 'badge-completed' : 'badge-pending'}">${item.status}</span>
            <button style="background:none; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem;" onclick="toggleOrderStatus('${id}', '${item.status}')">Estado</button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    window.toggleOrderStatus = async (id, currentStatus) => {
      const newStatus = currentStatus === 'Pendiente' ? 'Completado' : 'Pendiente';
      await updateDoc(doc(db, "pedidos", id), { status: newStatus });
    };
  </script>
</body>
</html>
